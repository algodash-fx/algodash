<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact · AlgoDash</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
  <!-- La barre latérale est remplie par js/layout.js (identique sur toutes les pages) -->
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <h1 class="visually-hidden">Contact</h1>

    <section class="card contact-card">
      <h2 class="contact-title">Une question ?</h2>
      <p class="contact-intro">Écris ton message, puis choisis comment l’envoyer.</p>

      <form id="contact-form" novalidate>
        <label class="field-label" for="message">Ton message</label>
        <textarea class="field" id="message" name="message" rows="7" maxlength="1500"
                  aria-describedby="message-error"></textarea>
        <div class="field-meta">
          <span class="field-error" id="message-error" role="alert"></span>
          <span class="field-counter" id="counter">0 / 1500</span>
        </div>

        <!-- Demandé uniquement pour l'envoi par e-mail (sert d'adresse de réponse) -->
        <div id="email-field">
          <label class="field-label" for="email">Ton e-mail <span class="field-hint">pour recevoir la réponse par e-mail</span></label>
          <input class="field" type="email" id="email" name="email" autocomplete="email"
                 placeholder="prenom@exemple.com" aria-describedby="email-error">
          <div class="field-meta"><span class="field-error" id="email-error" role="alert"></span></div>
        </div>

        <!-- Piège à robots : invisible pour les visiteurs, ne doit jamais être coché -->
        <input type="checkbox" name="botcheck" id="botcheck" class="visually-hidden" tabindex="-1"
               autocomplete="off" aria-hidden="true">

        <div class="contact-actions">
          <button type="submit" class="send send-mail" id="send-mail">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="2.5"></rect>
              <path d="m3.5 7 8.5 6.5L20.5 7"></path>
            </svg>
            <span>Envoyer par e-mail</span>
          </button>

          <button type="button" class="send send-telegram" id="send-telegram" hidden>
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <circle cx="12" cy="12" r="11" fill="#ffffff"></circle>
              <path fill="#26a5e4" d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"></path>
            </svg>
            <span>Envoyer sur Telegram</span>
          </button>
        </div>

        <p class="contact-status" id="contact-status" role="status"></p>
      </form>
    </section>
  </main>

  <script src="js/layout.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
