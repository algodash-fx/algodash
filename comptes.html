<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comptes · AlgoDash</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="comptes">
  <!-- La barre latérale est remplie par js/layout.js (identique sur toutes les pages) -->
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <h1 class="visually-hidden">Comptes</h1>

    <!-- Dernière mise à jour à gauche, filtre « Tous les comptes » à droite -->
    <header class="toolbar">
      <span class="updated" id="updated"></span>
      <button class="link-button" id="refresh" type="button">Actualiser</button>
      <div class="account accounts-filter" id="filter"></div>
    </header>

    <!-- Bandeau d'information : données d'exemple, données anciennes, erreur Myfxbook -->
    <p class="notice" id="notice" role="status" hidden></p>

    <!-- Une carte par compte, remplie par js/comptes.js -->
    <div class="accounts-grid" id="accounts"></div>
  </main>

  <script src="js/layout.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/comptes.js"></script>
</body>
</html>
